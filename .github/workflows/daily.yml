name: Steam reviews – daily collect

on:
  schedule:
    - cron: "23 17 * * *"   # 04:23 Melbourne (AEDT) / 03:23 (AEST), quiet hours for Steam
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = test each source, screen = re-screen games, daily = normal run"
        required: true
        default: smoke
        type: choice
        options: [smoke, screen, daily]

concurrency:
  group: steam-collector          # never run two collectors at once (one IP, one pace)
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      MODE: ${{ github.event.inputs.mode || 'daily' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure Drive (steam_reviews folder only)
        env:
          RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
        run: |
          if [ -z "$RCLONE_DRIVE_TOKEN" ]; then
            if [ "$MODE" = "smoke" ]; then
              echo "::warning::No RCLONE_DRIVE_TOKEN yet - smoke test runs without Drive (result is in the log)"
              echo "NO_DRIVE=1" >> "$GITHUB_ENV"; exit 0
            fi
            echo "::error::Add the RCLONE_DRIVE_TOKEN secret before daily runs - see TUTORIAL.md, step 3"; exit 1
          fi
          FOLDER_ID=$(python -c "import yaml;print(yaml.safe_load(open('config.yaml'))['drive']['root_folder_id'])")
          mkdir -p ~/.config/rclone
          {
            echo "[steamdrive]"
            echo "type = drive"
            echo "scope = drive"
            echo "root_folder_id = ${FOLDER_ID}"
            echo "token = ${RCLONE_DRIVE_TOKEN}"
          } > ~/.config/rclone/rclone.conf
          rclone lsf steamdrive: --max-depth 1 > /dev/null \
            || { echo "::error::rclone can't open the steam_reviews folder - see TUTORIAL.md, step 3"; exit 1; }

      - name: Download state from Drive
        run: if [ -z "$NO_DRIVE" ]; then rclone copy steamdrive:state data/state --create-empty-src-dirs || true; fi

      - name: Run collector (uploads to Drive every 10 minutes)
        run: |
          if [ -z "$NO_DRIVE" ]; then
            ( while sleep 600; do
                rclone copy data steamdrive: --transfers 4 --exclude "*.tmp" > /dev/null 2>&1 || true
              done ) &
            SYNC_PID=$!
          fi
          STATUS=0
          python -m collector.run "$MODE" || STATUS=$?
          if [ -n "$SYNC_PID" ]; then kill "$SYNC_PID" 2>/dev/null || true; fi
          exit $STATUS

      - name: Upload results to Drive
        if: always()
        run: |
          if [ -d data ] && [ -z "$NO_DRIVE" ]; then rclone copy data steamdrive: --transfers 4 --exclude "*.tmp"; fi

      - name: Keep run log on GitHub too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: |
            data/runs/
            data/smoke/
          if-no-files-found: ignore
          retention-days: 30
